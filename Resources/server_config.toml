desc = "🔥📢 ВНИМАНИЕ: СЕЙЧАС АКТИВНО ВЕДЕТСЯ ПОИСК ИГРОКОВ, АДМИНИСТРАЦИИ И ГЛАВ ОТДЕЛОВ! 📢🔥\n══════════════════════════════════════════\n🌌 Добро пожаловать на Classic Station — тот самый классический сервер Space Station 14 образца 2023 года!\nМы вернули ламповую атмосферу и старые системы, по которым все скучали:\n\n🧰 Старый удобный инвентарь — привычные слоты без сеточного тетриса!\n💊 Классическая быстрая медицина — простое лечение, химия и капсулы клонирования.\n⏱️ Таймеры на роли снижены в 4 раза — быстро открывай любые профессии и отделы!\n🎭 Ламповый MRP — право на ошибку в IC (за случайные игровые ошибки не банят!), без ТТС и со строгим запретом на 18+/ERP.\n📚 Восстановленная классическая Вики со всеми рецептами, СРП и Корпоративным законом.\n\n══════════════════════════════════════════\n⚡ СЕЙЧАС АКТИВНО ВЕДЕТСЯ ПОИСК И НАБОР ИГРОКОВ И АДМИНИСТРАЦИИ!\n💬 Заходи в наш Discord: https://discord.gg/A6pFnBgD9G\n🌐 Сайт сервера: https://classicstation14.com/\n📖 Вики проекта: https://wiki.classicstation14.com/"

